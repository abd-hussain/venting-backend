<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>إعادة تعيين كلمة المرور · Venting</title>
  <style>
:root {
  --bg: #0f0c14; --bg2: #1a1524; --card: #221c2e; --text: #f4f0fa;
  --muted: #a89bb8; --accent: #8A3CFE; --line: rgba(255,255,255,0.08);
  --error: #f87171; --ok: #34d399;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh;
  font-family: Inter, "Segoe UI", Tahoma, system-ui, sans-serif;
  background: linear-gradient(180deg, #16101f 0%, var(--bg) 45%, #0a0810 100%);
  color: var(--text); line-height: 1.55;
}
body.rtl { direction: rtl; font-family: "Segoe UI", Tahoma, "Noto Sans Arabic", sans-serif; }
.wrap { max-width: 440px; margin: 0 auto; padding: 40px 20px 64px; }
.brand { color: var(--accent); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; font-size: 13px; margin-bottom: 18px; }
h1 { font-size: 1.75rem; margin: 0 0 8px; }
.meta { color: var(--muted); margin: 0 0 28px; font-size: .95rem; }
label { display: block; color: #b7aeca; font-size: .9rem; font-weight: 600; margin: 0 0 8px; }
input {
  width: 100%; padding: 14px 16px; border-radius: 12px; border: 1.2px solid var(--accent);
  background: #12101a; color: #fff; font-size: 15px; outline: none;
}
input:focus { border-width: 1.6px; }
.hint { color: var(--muted); font-size: .8rem; margin: 8px 0 0; }
.rules { margin: 14px 0 0; padding: 0; list-style: none; color: var(--muted); font-size: .85rem; }
.rules li { margin: 6px 0; }
.rules .ok { color: var(--ok); }
button {
  margin-top: 24px; width: 100%; border: 0; border-radius: 999px; padding: 16px;
  background: var(--accent); color: #fff; font-weight: 700; font-size: 16px; cursor: pointer;
}
button:disabled { opacity: .45; cursor: not-allowed; }
.msg { margin-top: 14px; font-size: .9rem; }
.msg.error { color: var(--error); }
.msg.ok { color: var(--ok); }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 16px;
  padding: 18px; margin-bottom: 22px; color: var(--muted); font-size: .9rem;
}
</style>
</head>
<body class="rtl">
  <main class="wrap">
    <div class="brand">Venting</div>
    <h1>إعادة تعيين كلمة المرور</h1>
    <p class="meta">اختر كلمة مرور جديدة لحساب Venting.</p>
    <div class="card">ينتهي هذا الرابط خلال 60 دقيقة ويُستخدم مرة واحدة.</div>
    <form id="form">
      <label for="password">كلمة المرور الجديدة</label>
      <input id="password" type="password" autocomplete="new-password" required />
      <ul class="rules">
        <li id="r1">• 8 أحرف على الأقل</li>
        <li id="r2">• حرف كبير واحد</li>
        <li id="r3">• رقم واحد</li>
      </ul>
      <div style="height:18px"></div>
      <label for="confirm">تأكيد كلمة المرور</label>
      <input id="confirm" type="password" autocomplete="new-password" required />
      <button id="submit" type="submit">تحديث كلمة المرور</button>
      <p id="msg" class="msg" hidden></p>
    </form>
  </main>
  <script>
    const API_BASE = window.location.origin;
    const params = new URLSearchParams(window.location.search);
    const token = (params.get('token') || '').trim();
    const form = document.getElementById('form');
    const password = document.getElementById('password');
    const confirm = document.getElementById('confirm');
    const submit = document.getElementById('submit');
    const msg = document.getElementById('msg');
    const r1 = document.getElementById('r1');
    const r2 = document.getElementById('r2');
    const r3 = document.getElementById('r3');

    function show(text, ok) {
      msg.hidden = false;
      msg.textContent = text;
      msg.className = 'msg ' + (ok ? 'ok' : 'error');
    }

    function validate() {
      const v = password.value;
      const a = v.length >= 8; r1.className = a ? 'ok' : '';
      const b = /[A-Z]/.test(v); r2.className = b ? 'ok' : '';
      const c = /[0-9]/.test(v); r3.className = c ? 'ok' : '';
      return a && b && c;
    }
    password.addEventListener('input', validate);

    if (!token) {
      form.querySelectorAll('input,button').forEach(el => el.disabled = true);
      show('رابط إعادة التعيين غير صالح. اطلب رابطاً جديداً من التطبيق.', false);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!token) return;
      if (!validate()) { show('كلمة المرور لا تستوفي المتطلبات.', false); return; }
      if (password.value !== confirm.value) { show('كلمتا المرور غير متطابقتين.', false); return; }
      submit.disabled = true;
      try {
        const res = await fetch(API_BASE + '/v1/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password: password.value })
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok || body.status === 'failed') {
          const m = (body.error && body.error.message) || 'تعذر إعادة التعيين. ربما انتهت صلاحية الرابط.';
          show(m, false);
          submit.disabled = false;
          return;
        }
        show('تم تحديث كلمة المرور. يمكنك تسجيل الدخول من تطبيق Venting.', true);
        form.querySelectorAll('input').forEach(el => el.disabled = true);
      } catch (err) {
        show('تعذر إعادة التعيين. ربما انتهت صلاحية الرابط.', false);
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
